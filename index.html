<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>Relevé de notes</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&display=swap">
<link rel="icon" href="icon-192.png">
<style>
:root{--bl:#1f4e79;--bl2:#2e75b6;--bg:#f3f5f8;--bd:#d6dce4;--rd:#c0392b;--gr:#1e8449}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1c2733;font-size:15px}
header{background:var(--bl);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header small{opacity:.8;font-size:12px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:44px;z-index:4}
nav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-size:14px;color:#4a5866;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--bl);border-color:var(--bl2);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--bl)}
label{display:block;font-size:13px;color:#4a5866;margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;font-size:15px;font-family:inherit;background:#fff}
textarea{min-height:110px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 160px}
.btn{display:inline-block;border:0;border-radius:7px;padding:9px 14px;font-size:14px;cursor:pointer;background:var(--bl2);color:#fff;margin:4px 4px 0 0}
.btn.sec{background:#e8edf3;color:#1c2733}.btn.red{background:var(--rd)}.btn.sm{padding:5px 9px;font-size:13px}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th,table.g td{border:1px solid var(--bd);padding:6px 7px;text-align:left}
table.g th{background:#eef2f7;font-weight:600}
.scroll{overflow-x:auto}
.notes1 input{width:100%;font-size:17px;text-align:center}
.notes1 input.bad{border-color:var(--rd);background:#fdecea}
.grid input{width:64px;padding:6px;text-align:center}
.grid input.bad{border-color:var(--rd);background:#fdecea}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:150px}
.grid th:first-child{background:#eef2f7}
.muted{color:#6b7a89;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef2f7;font-size:12px;margin:2px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2733;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.show{opacity:.95}
#preview{display:none;position:fixed;inset:0;background:#5d6670;z-index:40;overflow:auto}
#preview .bar{position:sticky;top:0;background:#1c2733;padding:8px;text-align:center;z-index:2}
#printArea{padding:16px 0}
.page{background:#fff;width:8.5in;max-width:100%;min-height:10in;margin:0 auto 16px;padding:.5in;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page.land{width:11in;min-height:7.5in}
/* ---- documents imprimés ---- */
.doc{font-family:"Times New Roman",Times,serif;color:#000;font-size:12pt}
.doc .hd{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.doc .hd img{height:70px;width:70px;object-fit:contain}
.doc .hd .t{flex:1;text-align:center}
.doc .hd .nom{font-size:17pt;font-weight:bold;text-transform:uppercase}
.doc .hd .sub{font-size:10.5pt}
.doc .titre{text-align:center;font-size:15pt;font-weight:bold;text-decoration:underline;margin:8px 0}
.doc .info{display:flex;flex-wrap:wrap;justify-content:space-between;font-size:11.5pt;margin-bottom:8px}
.doc .info div{margin:2px 0}
.doc table{border-collapse:collapse;width:100%}
.doc th,.doc td{border:1px solid #000;padding:4px 6px;font-size:11.5pt}
.doc th{background:#e7e7e7}
.doc td.n,.doc th.n{text-align:center}
.doc .small th,.doc .small td{font-size:9.5pt;padding:3px 4px}
.doc .res{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:10px;font-size:12pt}
.doc .sig{display:flex;justify-content:space-between;margin-top:46px;font-size:11.5pt}
.doc .sig div{border-top:1px solid #000;width:40%;text-align:center;padding-top:3px}
.doc .vierge td{height:30px}
.doc .vierge thead{display:table-header-group}
.doc .hd2{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:10px}
.doc .hd2 img{width:95px;height:80px;object-fit:contain}
.doc .hd2 .t{flex:1;text-align:center}
.doc .hd2 .nom{font-family:Algerian,"Cinzel Decorative",Castellar,"Times New Roman",serif;font-size:21pt;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.doc .hd2 .ad{font-family:Arial,Helvetica,sans-serif;font-weight:bold;font-size:11pt;margin-top:3px}
.doc.bul{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:13pt;padding:0 .45in}
.doc.bul .bi{display:grid;grid-template-columns:62% 38%;row-gap:6px;margin:6px 0 22px}
.doc.bul .bt th{background:none;font-weight:normal;font-size:16pt;padding:3px}
.doc.bul .bt td{font-size:13pt;padding:3px 8px}
.doc.bul sup{font-size:65%}
.doc.bul .bl{display:flex;justify-content:space-between;margin-top:26px}
.doc.bul .bm{text-align:center;margin-top:30px}
.doc.bul .bo{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px}
.doc.bul .sg{border-top:1px solid #000;padding-top:2px;min-width:140px;text-align:center}
.doc.bul .bd{display:flex;justify-content:center;margin-top:50px}
.doc .dec{font-weight:bold;font-size:13pt}
@media print{
  @page{size:letter;margin:.5in}
  @page land{size:letter landscape;margin:.4in}
  body{background:#fff}
  header,nav,main,#toast,#preview .bar{display:none!important}
  #preview{display:block!important;position:static;background:#fff;overflow:visible}
  #printArea{padding:0}
  .page{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .page.land{page:land}
  .doc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><h1>Relevé de notes</h1><small id="hdSchool"></small></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="preview"><div class="bar">
  <button class="btn" onclick="window.print()">🖨️ Imprimer / PDF</button>
  <button class="btn sec" onclick="closePreview()">✕ Fermer</button></div>
  <div id="printArea"></div></div>
<div id="toast"></div>

const KEY='releve_renaissance_v1';
const CTRL_LONG={1:'Premier',2:'Deuxième',3:'Troisième',4:'Quatrième'};
const EXTRAS=[{id:'_ret',nom:'Retards'},{id:'_abs',nom:'Absences'},{id:'_dev',nom:'Devoirs non rédigés'}];
const supOrd=t=>esc(t).replace(/(\d+)\s?(ème|eme|ère|ere|er|re|e)(?![a-zà-ÿ])/gi,'$1<sup>$2</sup>');
const TABS=[['ecole','École'],['classes','Classes & matières'],['eleves','Élèves'],['notes','Saisie des notes'],['imprimer','Imprimer'],['sauvegarde','Sauvegarde']];
function defState(){return{school:{nom:'COLLEGE MIXTE LA RENAISSANCE',adresse:'#4, Impasse lumière, rue grande plaine, croix- des- bouquets',tel:'+(509) 3150-3187',devise:'',annee:'2026-2027',directeur:'',logo:LOGO0,nbCtrl:4,libelle:'Contrôle',echelle:10,seuil:5},classes:[],notes:{}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const s=defState();const o={...s,...d,school:{...s.school,...(d.school||{})}};Object.assign(o.school,{nbCtrl:4,echelle:10,seuil:5});return o}}catch(e){}return defState()}
let S=load(), tab='ecole', ui={cls:'',ctrl:1,mat:'',pcls:'',pper:'1',pel:'all'};
try{const u=JSON.parse(localStorage.getItem(KEY+'_ui')||'{}');Object.assign(ui,u);if(u.tab)tab=u.tab}catch(e){}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
let saveT;
function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(S));if(!quiet)toast('Enregistré ✓')}catch(e){toast('⚠️ Impossible d’enregistrer (stockage plein ?)')}}
function saveUI(){try{localStorage.setItem(KEY+'_ui',JSON.stringify({...ui,tab}))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fx=(n,d=2)=>(n==null||isNaN(n))?'—':(+n).toFixed(d).replace('.',',');
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}
const getC=id=>S.classes.find(c=>c.id===id);
const nbC=()=>4;
const ordinal=(k,f)=>k===1?(f?'1re':'1er'):k+'e';
const ctrlName=k=>ordinal(k)+' '+(S.school.libelle||'Contrôle');
const fullName=e=>(e.nom||'').toUpperCase()+' '+(e.prenom||'');

/* ================== CALCULS ================== */
function noteOf(c,k,e,m){const v=S.notes?.[c.id]?.[k]?.[e]?.[m];return num(v)}
function totalMax(c){return c.matieres.reduce((a,m)=>a+(+m.sur||0),0)}
function rank(arr,key){const s=arr.filter(r=>r.ok).sort((a,b)=>b[key]-a[key]);s.forEach((r,i)=>{r.rang=(i>0&&Math.abs(s[i-1][key]-r[key])<1e-9)?s[i-1].rang:i+1});arr.forEach(r=>{if(!r.ok)r.rang=null})}
function resCtrl(c,k){
  const max=totalMax(c),E=+S.school.echelle||10;
  const res=c.eleves.map(e=>{let t=0,miss=0,any=0;c.matieres.forEach(m=>{const v=noteOf(c,k,e.id,m.id);if(v==null)miss++;else{t+=v;any++}});
    return{e,total:t,max,moy:max?t/max*E:0,miss,ok:any>0}});
  rank(res,'moy');
  const ok=res.filter(r=>r.ok);res.moyClasse=ok.length?ok.reduce((a,r)=>a+r.moy,0)/ok.length:null;
  res.max=max;return res}
function ctrlActifs(c){const a=[];for(let k=1;k<=nbC();k++){const d=S.notes?.[c.id]?.[k];if(d&&Object.values(d).some(o=>Object.values(o).some(v=>num(v)!=null)))a.push(k)}return a}
function resAnnuel(c){
  const act=ctrlActifs(c),per={};act.forEach(k=>per[k]=resCtrl(c,k));
  const res=c.eleves.map((e,i)=>{const m={};act.forEach(k=>m[k]=per[k][i].ok?per[k][i].moy:null);
    const vals=act.map(k=>m[k]??0);const moy=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const miss=act.filter(k=>m[k]==null).length;
    return{e,parCtrl:m,moy,miss,ok:act.some(k=>m[k]!=null)}});
  rank(res,'moy');const ok=res.filter(r=>r.ok);
  res.moyClasse=ok.length?ok.reduce((a,r)=>a+r.moy,0)/ok.length:null;res.act=act;res.per=per;return res}
function apprec(moy){if(r2(moy)<5)return'Insuffisant';const E=+S.school.echelle||10,r=moy/E,s=(+S.school.seuil||E/2)/E;
  if(r>=.9)return'Excellent';if(r>=.8)return'Très bien';if(r>=.7)return'Bien';if(r>=.6&&r>=s)return'Assez bien';if(r>=s)return'Passable';return'Insuffisant'}
const r2=x=>Math.round(x*100)/100;
function decision(moy,e,c){const f=e.sexe==='F';return r2(moy)>=5?`${f?'Admise':'Admis'} en ${c.sup||'classe supérieure'}`:`${f?'Redouble':'Redouble'} la ${c.nom}`}

/* ================== RENDU ================== */
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('hdSchool').textContent=S.school.nom||'';
  document.getElementById('main').innerHTML=V[tab]();

  const moyTxt=m=>{const t=r2(m).toFixed(2).split('.');return`${t[0]}.<sup>${t[1]}</sup>`};
  const placeTxt=(rg,e)=>rg?(rg===1?`1<sup>${e.sexe==='F'?'re':'er'}</sup>`:`${rg}<sup>e</sup>`):'—';
  showPrint(list.map(e=>{const i=c.eleves.indexOf(e),x=r[i],f=e.sexe==='F',ex=id=>S.notes?.[c.id]?.[k]?.[e.id]?.[id];
    return`<div class="page"><div class="doc bul">${hdr()}
    <div class="bi"><div>Nom de l’élève: ${esc(e.nom)} ${esc(e.prenom)}</div><div>Niveau de l’élève: ${supOrd(c.nom)}</div>
    <div>Année Académique: ${esc(S.school.annee)}</div><div>${CTRL_LONG[k]} Contrôle</div></div>
    <table class="bt"><tr><th>Matières</th><th>Notes</th><th>Coefficients</th></tr>
    ${c.matieres.map(m=>`<tr><td>${esc(m.nom)}</td><td class="n">${pad(noteOf(c,k,e.id,m.id),wOf(m))}</td><td class="n">${fx(m.sur,0)}</td></tr>`).join('')}
    ${EXTRAS.map(o=>`<tr><td>${o.nom}</td><td class="n">${pad(num(ex(o.id))??0,2)}</td><td></td></tr>`).join('')}</table>
    <div class="bl"><div>Total: ${x.ok?fx(x.total,x.total%1?2:0).replace(',','.'):'—'}/${fx(r.max,0)}</div><div>Place : ${placeTxt(x.rang,e)}</div></div>
    <div class="bm">Moyenne de l’élève: ${x.ok?moyTxt(x.moy):'—'}</div>
    <div class="bo"><div>${ann?(r2(ann[i].moy)>=5?`Observation : L’élève est ${f?'admise':'admis'} en ${supOrd(c.sup||'classe supérieure')}`:`Observation : L’élève redouble la ${supOrd(c.nom)}`):''}</div><div class="sg">Parents</div></div>
    <div class="bd"><div class="sg">Directeur</div></div></div></div>`}).join(''))}

function pPalmares(ann){const c=getC(ui.pcls);if(!guard(c))return;const E=10,k=+ui.pper;
  const r=ann?resAnnuel(c):resCtrl(c,k);if(ann?!r.act.length:!r.some(x=>x.ok)){toast('Aucune note saisie');return}
  const rows=[...r].sort((a,b)=>(a.rang??1e9)-(b.rang??1e9));
  const adm=r.filter(x=>x.ok&&r2(x.moy)>=5).length,n=r.filter(x=>x.ok).length;
  showPrint(`<div class="page"><div class="doc">${head('CLASSEMENT — '+(ann?'FIN D’ANNÉE':esc(ctrlName(k)).toUpperCase()),c)}
  <table><tr><th class="n">Rang</th><th>Nom et prénom</th>${ann?'':`<th class="n">Total /${fx(r.max,0)}</th>`}<th class="n">Moyenne /${E}</th><th>${ann?'Observation':'Appréciation'}</th></tr>
  ${rows.map(x=>`<tr><td class="n">${x.rang?ordinal(x.rang,x.e.sexe==='F'):'—'}</td><td>${esc(fullName(x.e))}</td>${ann?'':`<td class="n">${x.ok?nt(x.total):'—'}</td>`}<td class="n">${x.ok?fx(x.moy):'—'}</td><td>${!x.ok?'Pas de notes':ann?decision(x.moy,x.e,c):apprec(x.moy)}</td></tr>`).join('')}</table>
  <div class="res"><div><b>Effectif :</b> ${c.eleves.length}</div><div><b>Moyenne de la classe :</b> ${fx(r.moyClasse)}</div><div><b>${ann?'Admis':'Ont la moyenne'} :</b> ${adm} sur ${n}${n?` (${Math.round(adm/n*100)} %)`:''}</div></div>
  <div class="sig"><div>Direction${S.school.directeur?'<br>'+esc(S.school.directeur):''}</div><div>Titulaire de la classe</div></div></div></div>`)}

function pReleve(ann){const c=getC(ui.pcls);if(!guard(c))return;const E=10;
  if(ann){const r=resAnnuel(c);if(!r.act.length){toast('Aucune note saisie');return}
    showPrint(`<div class="page"><div class="doc">${head('MOYENNES DE L’ANNÉE',c)}<table><tr><th class="n">N°</th><th>Nom et prénom</th>${[1,2,3,4].map(k=>`<th class="n">${esc(ctrlName(k))}</th>`).join('')}<th class="n">Moy. générale</th><th class="n">Rang</th><th>Observation</th></tr>
    ${r.map((x,i)=>`<tr><td class="n">${i+1}</td><td>${esc(fullName(x.e))}</td>${[1,2,3,4].map(k=>`<td class="n">${x.parCtrl[k]==null?'':fx(x.parCtrl[k])}</td>`).join('')}<td class="n"><b>${x.ok?fx(x.moy):'—'}</b></td><td class="n">${x.rang??'—'}</td><td>${x.ok?decision(x.moy,x.e,c):'—'}</td></tr>`).join('')}</table></div></div>`);return}
  const k=+ui.pper,r=resCtrl(c,k);
  showPrint(`<div class="page land"><div class="doc">${head('RELEVÉ DE NOTES — '+esc(ctrlName(k)).toUpperCase(),c)}<table class="small"><tr><th class="n">N°</th><th>Nom et prénom</th>${c.matieres.map(m=>`<th class="n">${esc(m.nom)}<br>/${fx(m.sur,0)}</th>`).join('')}<th class="n">Total<br>/${fx(r.max,0)}</th><th class="n">Moy.<br>/${E}</th><th class="n">Rang</th></tr>
  ${r.map((x,i)=>`<tr><td class="n">${i+1}</td><td>${esc(fullName(x.e))}</td>${c.matieres.map(m=>`<td class="n">${nt(noteOf(c,k,x.e.id,m.id))}</td>`).join('')}<td class="n"><b>${x.ok?nt(x.total):''}</b></td><td class="n"><b>${x.ok?fx(x.moy):''}</b></td><td class="n">${x.rang??''}</td></tr>`).join('')}
  </table><div class="res"><div><b>Moyenne de la classe :</b> ${fx(r.moyClasse)} / ${E}</div></div></div></div>`)}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
